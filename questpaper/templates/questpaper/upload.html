{% extends 'main_app/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Upload Question Papers</h2>
    
    <!-- Single Upload -->
    <div class="card mb-4">
        <div class="card-header">
            <h4>Upload Single Paper</h4>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ single_form.as_p }}
                <button type="submit" class="btn btn-primary">Upload Single Paper</button>
            </form>
        </div>
    </div>
    
    <!-- Bulk Upload -->
    <div class="card">
        <div class="card-header">
            <h4>Bulk Upload Multiple Papers</h4>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ bulk_form.as_p }}
                <button type="submit" class="btn btn-success">Upload Multiple Papers</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
